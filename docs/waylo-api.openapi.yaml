openapi: 3.1.0
info:
  title: Waylo Backend API
  version: 0.2.0
  summary: API REST del backend de Waylo
  description: |
    Contrato del servidor Fastify desplegado en este repositorio. La URL del
    servidor es relativa: Swagger ejecuta solicitudes contra el mismo origen
    desde el que se abrió `/docs` (local, preview o producción).

    Las rutas de usuario usan la cookie de sesión httpOnly `waylo_session`.
    Las rutas `/internal/*` son exclusivamente servidor a servidor y requieren
    `X-Waylo-Internal-Key`; nunca deben llamarse desde un navegador.

    Esta especificación solo incluye rutas REST registradas actualmente. Chat,
    voz, triage, hospitales y calendario no están implementados en este servidor.
servers:
  - url: /
    description: Mismo origen de esta instancia de Waylo Backend
tags:
  - name: Sistema
    description: Estado operativo del servicio.
  - name: Autenticación
    description: Registro, inicio y cierre de sesiones por cookie.
  - name: Consentimiento
    description: Registro de aceptación del aviso de tratamiento de datos.
  - name: Perfil
    description: Perfil de la cuenta Waylo y estado de vínculo legacy con IPS.
  - name: Integración IPS interna
    description: |
      Integración privada para el BFF de Waylo. Requiere la clave de servidor
      configurada como `WAYLO_INTERNAL_KEY` en este backend. No exponerla al cliente.
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [Sistema]
      operationId: getHealth
      summary: Consultar salud del proceso
      description: Confirma que la instancia responde. No comprueba conectividad de base de datos ni disponibilidad de IPS.
      security: []
      responses:
        '200':
          description: Proceso disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example: { status: ok }

  /auth/register:
    post:
      tags: [Autenticación]
      operationId: registerAccount
      summary: Crear una cuenta Waylo
      description: |
        Normaliza el correo a minúsculas, crea la cuenta y un perfil vacío,
        abre una sesión y devuelve la cookie `waylo_session` httpOnly. El cuerpo
        no incluye nombre ni perfil clínico. El correo debe ser único.
      security: []
      requestBody:
        required: true
        description: Credenciales iniciales de la cuenta.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { email: paciente@example.com, password: 'Clave-segura-123' }
      responses:
        '201':
          description: Cuenta creada y sesión iniciada.
          headers:
            Set-Cookie:
              description: Cookie de sesión httpOnly, SameSite=Lax, Path=/; Secure en producción.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example: { id: clx123abc, email: paciente@example.com }
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: EMAIL_TAKEN, message: El email ya existe } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      description: Verifica las credenciales, crea una nueva sesión y establece `waylo_session`. La contraseña nunca se devuelve.
      security: []
      requestBody:
        required: true
        description: Correo y contraseña de la cuenta existente.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: paciente@example.com, password: 'Clave-segura-123' }
      responses:
        '200':
          description: Autenticación correcta.
          headers:
            Set-Cookie:
              description: Cookie de sesión httpOnly, SameSite=Lax, Path=/; Secure en producción.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example: { id: clx123abc, email: paciente@example.com }
        '401':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: INVALID_CREDENTIALS, message: Credenciales inválidas } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar la sesión actual
      description: Elimina la sesión asociada a la cookie y la expira en el navegador.
      responses:
        '204': { description: Sesión cerrada; no hay cuerpo de respuesta. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/account:
    delete:
      tags: [Autenticación]
      operationId: deleteAccount
      summary: Eliminar la cuenta Waylo
      description: |
        Elimina los datos de la cuenta Waylo y la sesión. Si existe un vínculo
        IPS activo, intenta consultar las citas para incluirlas en la respuesta.
        Las citas permanecen en la IPS y no se cancelan. Si la IPS no responde,
        la eliminación continúa y `appointments_left_in_ips` puede venir vacío.
      responses:
        '200':
          description: Cuenta eliminada. Las citas listadas siguen en la IPS.
          headers:
            Set-Cookie:
              description: La cookie `waylo_session` se expira.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteAccountResponse' }
              example:
                deleted: true
                appointments_left_in_ips: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /consent:
    post:
      tags: [Consentimiento]
      operationId: createConsent
      summary: Registrar aceptación del aviso de tratamiento de datos
      description: Guarda la versión aceptada y la fecha. Se conserva una prueba seudonimizada incluso tras eliminar la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example: { text_version: '2026-10-v1' }
      responses:
        '201':
          description: Consentimiento registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
              example: { text_version: '2026-10-v1', granted_at: '2026-10-27T14:30:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ips/link:
    get:
      tags: [Perfil]
      operationId: getIpsLink
      summary: Consultar vínculo IPS de la cuenta actual
      description: Devuelve `none` si no existe vínculo. Esta ruta pertenece al modelo de cuentas legacy de este backend.
      responses:
        '200':
          description: Estado del vínculo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyIpsLinkState' }
              example: { status: none, ips: null, linked_at: null, status_changed_at: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Perfil]
      operationId: linkIps
      summary: Vincular la cuenta actual con una IPS
      description: |
        Intercambia documento, EPS y código de activación con la IPS elegida.
        El token devuelto por la IPS se cifra antes de guardarse y nunca se devuelve.
        Si hay más de una IPS activa, se debe indicar `ips_id`. Un vínculo activo
        existente debe desvincularse antes de iniciar otro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyIpsLinkRequest' }
            example:
              document_type: CC
              document_number: '1032456789'
              eps: Confianza
              activation_code: '123456'
              ips_id: confianza
      responses:
        '200':
          description: Cuenta vinculada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyIpsLinkState' }
        '401':
          description: Documento o código rechazado por la IPS, o sesión ausente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya hay un vínculo activo o no hay ninguna IPS activa disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/IpsUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Perfil]
      operationId: unlinkIps
      summary: Desvincular la cuenta actual de su IPS
      description: Desactiva el vínculo local y elimina el token cifrado. No cancela citas ni cambia la afiliación en el sistema de la IPS. Es idempotente si no hay vínculo.
      responses:
        '200':
          description: Estado posterior a la desvinculación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyIpsLinkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Perfil]
      operationId: getMe
      summary: Obtener perfil, consentimiento y vínculo de la cuenta actual
      description: |
        Combina los campos locales disponibles con los datos devueltos en vivo por
        la IPS cuando hay vínculo activo. Cada campo de perfil identifica su fuente.
        En esta versión no hay endpoint para editar los campos locales.
      responses:
        '200':
          description: Perfil de la cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/ips/link:
    get:
      tags: [Integración IPS interna]
      operationId: getExternalIpsLink
      summary: Consultar el vínculo IPS de una identidad externa
      description: Devuelve el estado asociado a `external_subject`; requiere autenticación de servidor a servidor.
      security: [{ wayloInternalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ExternalSubject'
      responses:
        '200':
          description: Estado del vínculo externo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalIpsLinkState' }
              example: { status: none, ips: null, linked_at: null, status_changed_at: null }
        '401': { $ref: '#/components/responses/InvalidInternalKey' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Integración IPS interna]
      operationId: createExternalIpsLink
      summary: Vincular una identidad externa con una IPS
      description: |
        Activa la afiliación usando el adaptador configurado, guarda el token IPS
        cifrado y devuelve solo el estado. Un vínculo activo no vencido produce
        `409 LINK_EXISTS`; un vínculo vencido puede volver a activarse.
      security: [{ wayloInternalKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalIpsLinkRequest' }
            example:
              external_subject: waylo-user-123
              ips_id: confianza
              document_type: CC
              document_number: '1032456789'
              eps: Confianza
              activation_code: '123456'
      responses:
        '200':
          description: Vínculo externo activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalIpsLinkState' }
        '401': { $ref: '#/components/responses/UnauthorizedOrInvalidActivation' }
        '409':
          description: Ya hay un vínculo activo, o no existe una IPS activa seleccionable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Clave interna no configurada o la IPS no respondió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Integración IPS interna]
      operationId: unlinkExternalIps
      summary: Desvincular una identidad externa de la IPS
      description: Elimina el token guardado y marca el vínculo como `unlinked`; no cambia datos ni citas en la IPS. Es idempotente si no existe vínculo.
      security: [{ wayloInternalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ExternalSubject'
      responses:
        '200':
          description: Estado posterior a la desvinculación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalIpsLinkState' }
        '401': { $ref: '#/components/responses/InvalidInternalKey' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/ips/patient:
    get:
      tags: [Integración IPS interna]
      operationId: getExternalIpsPatient
      summary: Consultar el paciente vinculado en la IPS
      description: Usa el token almacenado en el backend y devuelve el paciente normalizado. No persiste una copia del perfil clínico.
      security: [{ wayloInternalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ExternalSubject'
      responses:
        '200':
          description: Paciente normalizado por el adaptador IPS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalPatient' }
        '401': { $ref: '#/components/responses/UnauthorizedOrInvalidActivation' }
        '409': { $ref: '#/components/responses/NoActiveLink' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /internal/ips/appointments:
    get:
      tags: [Integración IPS interna]
      operationId: listExternalIpsAppointments
      summary: Consultar citas del paciente vinculado
      description: Lectura en vivo a través del adaptador IPS. Este backend no crea, cancela ni reprograma citas.
      security: [{ wayloInternalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ExternalSubject'
      responses:
        '200':
          description: Lista de citas normalizadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/UnauthorizedOrInvalidActivation' }
        '409': { $ref: '#/components/responses/NoActiveLink' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/IntegrationUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: waylo_session
      description: |
        Cookie httpOnly creada por `/auth/register` o `/auth/login`. Al abrir
        Swagger en el mismo origen del backend, el navegador la envía automáticamente;
        el JavaScript de la página no puede leer su valor.
    wayloInternalKey:
      type: apiKey
      in: header
      name: X-Waylo-Internal-Key
      description: |
        Secreto servidor a servidor; el backend valida contra `WAYLO_INTERNAL_KEY`.
        No introducir la clave de producción en Swagger ni en otro navegador.
        Para explorar estas rutas, usar únicamente una clave de un entorno de prueba.
  parameters:
    ExternalSubject:
      name: external_subject
      in: query
      required: true
      description: Identificador estable de la persona en el sistema frontend. No incluir correo ni datos clínicos.
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: waylo-user-123
  responses:
    Unauthorized:
      description: Cookie ausente, inválida o sesión vencida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHORIZED, message: Sin sesión } }
    InvalidInternalKey:
      description: Header interno ausente o incorrecto.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHORIZED, message: Credencial interna inválida } }
    UnauthorizedOrInvalidActivation:
      description: Clave interna ausente o incorrecta, o la IPS rechazó el documento, el código o el token de acceso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            internal_key:
              summary: Credencial interna inválida
              value: { error: { code: UNAUTHORIZED, message: Credencial interna inválida } }
            ips_activation:
              summary: IPS rechazó los datos de activación
              value: { error: { code: LINK_INVALID, message: Código o documento inválidos } }
    ValidationError:
      description: Parámetro o cuerpo inválido según el esquema de validación del endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION, message: 'activation_code: El código de activación son 6 dígitos' } }
    NoActiveLink:
      description: No existe un vínculo IPS activo o el token expiró.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NO_ACTIVE_LINK, message: No hay un vínculo IPS activo o el token expiró } }
    IpsUnavailable:
      description: La IPS no respondió o devolvió un error de servicio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: IPS_UNAVAILABLE, message: La IPS no respondió } }
    IntegrationUnavailable:
      description: La integración IPS interna no está configurada o la IPS no respondió.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INTERNAL, message: Error interno } }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_CREDENTIALS, UNAUTHORIZED, NOT_FOUND, EMAIL_TAKEN, LINK_EXISTS, LINK_INVALID, NO_ACTIVE_LINK, INTEGRATION_UNAVAILABLE, IPS_UNAVAILABLE, VALIDATION, INTERNAL]
            message: { type: string }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, description: Se elimina espacio exterior y se almacena en minúsculas. }
        password: { type: string, minLength: 8, maxLength: 1000, format: password }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1000, format: password }
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string, description: Identificador interno opaco de la cuenta. }
        email: { type: string, format: email }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [text_version]
      properties:
        text_version: { type: string, minLength: 1, maxLength: 100, description: Versión exacta del aviso mostrado y aceptado. }
    ConsentResponse:
      type: object
      additionalProperties: false
      required: [text_version, granted_at]
      properties:
        text_version: { type: string }
        granted_at: { type: string, format: date-time }
    LegacyIpsLinkRequest:
      type: object
      additionalProperties: false
      required: [document_type, document_number, activation_code]
      properties:
        document_type: { type: string, minLength: 2, maxLength: 20 }
        document_number: { type: string, minLength: 3, maxLength: 40 }
        eps: { type: [string, 'null'], minLength: 2, maxLength: 120, description: Necesario para adaptadores IPS que lo exigen. }
        activation_code: { type: string, pattern: '^\d{6}$', description: Código de activación de seis dígitos. }
        ips_id: { type: string, minLength: 1, maxLength: 64, description: Slug de IPS; obligatorio si hay más de una IPS activa. }
    LegacyIpsLinkState:
      type: object
      additionalProperties: false
      required: [status, ips, linked_at, status_changed_at]
      properties:
        status: { type: string, enum: [none, active, unlinked, deactivated] }
        ips:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string } }
        linked_at: { type: [string, 'null'], format: date-time }
        status_changed_at: { type: [string, 'null'], format: date-time }
    FieldValue:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: [string, 'null'] }
        source: { type: string, enum: [local, ips] }
    MeResponse:
      type: object
      additionalProperties: false
      required: [user, consent, profile, primary_site, link]
      properties:
        user: { $ref: '#/components/schemas/UserResponse' }
        consent:
          type: object
          additionalProperties: false
          required: [granted, text_version]
          properties:
            granted: { type: boolean }
            text_version: { type: [string, 'null'] }
        profile:
          type: object
          additionalProperties: false
          required: [name, sex, birth_date, city, eps]
          properties:
            name: { $ref: '#/components/schemas/FieldValue' }
            sex: { $ref: '#/components/schemas/FieldValue' }
            birth_date: { $ref: '#/components/schemas/FieldValue' }
            city: { $ref: '#/components/schemas/FieldValue' }
            eps: { $ref: '#/components/schemas/FieldValue' }
        primary_site:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PrimarySite'
        link: { $ref: '#/components/schemas/LegacyIpsLinkState' }
    PrimarySite:
      type: object
      additionalProperties: false
      required: [id, name, address, city]
      properties:
        id: { type: [integer, 'null'] }
        name: { type: string }
        address: { type: string }
        city: { type: string }
    ExternalIpsLinkRequest:
      type: object
      additionalProperties: false
      required: [external_subject, document_type, document_number, eps, activation_code]
      properties:
        external_subject: { type: string, minLength: 1, maxLength: 200, description: Identificador opaco estable del usuario en el BFF. }
        ips_id: { type: string, minLength: 1, maxLength: 64, default: confianza, description: Slug de IPS; si se omite se usa `confianza`. }
        document_type: { type: string, minLength: 2, maxLength: 20 }
        document_number: { type: string, minLength: 3, maxLength: 40 }
        eps: { type: string, minLength: 2, maxLength: 120 }
        activation_code: { type: string, pattern: '^\d{6}$' }
    ExternalIpsLinkState:
      type: object
      additionalProperties: false
      required: [status, ips, linked_at, status_changed_at]
      properties:
        status: { type: string, enum: [none, active, expired, unlinked, deactivated] }
        ips:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
        linked_at: { type: [string, 'null'], format: date-time }
        status_changed_at: { type: [string, 'null'], format: date-time }
    CanonicalPatient:
      type: object
      additionalProperties: false
      required: [patientId, name, sex, birthDate, city, eps, primarySite]
      properties:
        patientId: { type: integer, description: Identificador del paciente dentro de la IPS. }
        name: { type: [string, 'null'] }
        sex: { type: [string, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        city: { type: [string, 'null'] }
        eps: { type: [string, 'null'] }
        primarySite:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PrimarySite'
    Appointment:
      type: object
      additionalProperties: false
      required: [id, type, startsAt, endsAt, status, reason, doctorName, site]
      properties:
        id: { type: string, description: Identificador opaco de cita en la IPS. }
        type: { type: [string, 'null'], enum: [general, priority, null] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [requested, confirmed, cancelled, completed, no_show] }
